name: Build firmware

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_REF: 2.3.0
  TINYUSB_REF: 2d56dc533e45e4e91b15e93fdab5e22e964f328d
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
  ARM_TOOLCHAIN_VERSION: 15.2.rel1
  ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_TOOLCHAIN_PATH: ${{ github.workspace }}/arm-toolchain

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: pico2-w-release
            artifact: ds5-bridge-companion
          - preset: waveshare-rp2350b-plus-w-release
            artifact: ds5-bridge-companion-waveshare
          - preset: waveshare-rp2350b-plus-w-oled-release
            artifact: ds5-bridge-companion-waveshare-oled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake python3 build-essential ninja-build

      # The Ubuntu apt-packaged gcc-arm-none-eabi 13.2 (15:13.2.rel1-2)
      # produces Waveshare RP2350B-Plus-W binaries with audible audio static
      # that ARM's official toolchains do not exhibit. Use ARM's 15.2.Rel1
      # tarball instead of the apt package.
      - name: Cache ARM toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v5
        with:
          path: ${{ env.ARM_TOOLCHAIN_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Download ARM toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_PATH"
          curl -fsSL "$ARM_TOOLCHAIN_URL" | sudo tar -xJ -C "$ARM_TOOLCHAIN_PATH" --strip-components=1
          sudo chmod -R a+rX "$ARM_TOOLCHAIN_PATH"

      - name: Add ARM toolchain to PATH
        run: |
          echo "$ARM_TOOLCHAIN_PATH/bin" >> "$GITHUB_PATH"

      - name: Verify ARM toolchain
        run: |
          which arm-none-eabi-gcc
          arm-none-eabi-gcc --version

      - name: Download Pico SDK
        run: |
          git clone --depth 1 --branch "$PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive

      - name: Switch TinyUSB to configured revision
        run: |
          if ! git -C "$PICO_SDK_PATH/lib/tinyusb" rev-parse -q --verify "${TINYUSB_REF}^{commit}" >/dev/null; then
            git -C "$PICO_SDK_PATH/lib/tinyusb" fetch --depth 1 origin "$TINYUSB_REF"
          fi
          git -C "$PICO_SDK_PATH/lib/tinyusb" checkout --detach "$TINYUSB_REF"
          test "$(git -C "$PICO_SDK_PATH/lib/tinyusb" rev-parse HEAD)" = "$TINYUSB_REF"

      - name: Configure Release firmware
        run: cmake --preset "${{ matrix.preset }}" -DPICO_SDK_PATH="$PICO_SDK_PATH"

      - name: Build Release firmware
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Package firmware
        run: |
          mkdir -p artifacts
          cp "build/${{ matrix.preset }}/ds5-bridge.uf2" "artifacts/${{ matrix.artifact }}.uf2"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/${{ matrix.artifact }}.uf2
          archive: false
          if-no-files-found: error
