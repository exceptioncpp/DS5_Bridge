name: Companion checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  companion:
    name: Typecheck, test, and build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci

      - name: Build audio helper
        working-directory: companion
        run: npm run build:audio-helper

      - name: Typecheck companion
        working-directory: companion
        run: npm run typecheck

      - name: Test companion
        working-directory: companion
        run: npm test

      - name: Build companion
        working-directory: companion
        run: npm run build:app

      # Only on the dock test PR; regular Companion checks remain lightweight.
      - name: Set up ARM toolchain for dock test installer
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/dock-auto-poweroff-optout'
        uses: carlosperate/arm-none-eabi-gcc-action@v1.12.3
        with:
          release: '15.2.Rel1'

      - name: Install Ninja for dock test installer
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/dock-auto-poweroff-optout'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Install Pico SDK for dock test installer
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/dock-auto-poweroff-optout'
        shell: pwsh
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_SDK_REF: 2.3.0
          TINYUSB_REF: 2d56dc533e45e4e91b15e93fdab5e22e964f328d
        run: |
          git clone --depth 1 --branch "$env:PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$env:PICO_SDK_PATH"
          git -C "$env:PICO_SDK_PATH" submodule update --init --recursive
          $tinyUsbPath = Join-Path $env:PICO_SDK_PATH 'lib/tinyusb'
          git -C "$tinyUsbPath" rev-parse -q --verify "$env:TINYUSB_REF^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C "$tinyUsbPath" fetch --depth 1 origin "$env:TINYUSB_REF"
          }
          git -C "$tinyUsbPath" checkout --detach "$env:TINYUSB_REF"
          if ((git -C "$tinyUsbPath" rev-parse HEAD).Trim() -ne $env:TINYUSB_REF) {
            throw 'TinyUSB revision mismatch.'
          }

      - name: Build Windows dock test installer
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/dock-auto-poweroff-optout'
        working-directory: companion
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: npm run installer:win

      - name: Upload Windows dock test installer
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/dock-auto-poweroff-optout'
        uses: actions/upload-artifact@v4
        with:
          name: DS5-Bridge-Companion-Dock-Test-Windows
          path: companion/artifacts/installer/DS5-Bridge-Companion-Setup-*.exe
          if-no-files-found: error
